<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Navigation Header</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #06b6d4;
      --accent-glow: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* Brand Logo Container */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      transition: opacity 0.2s ease;
    }

    .brand-logo:hover {
      opacity: 0.9;
    }

    /* SVG Vector Logo */
    .logo-icon {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.4));
    }

    .brand-text span {
      color: var(--accent-color);
    }

    /* Nav Links */
    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent-glow);
    }

    /* CTA Button */
    .btn-cta {
      background: linear-gradient(135deg, var(--accent-color), #2563eb);
      color: #ffffff;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }

    /* Hero Preview Section */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }

    .hero-title {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      max-width: 600px;
    }

    .hero-subtitle {
      color: var(--text-muted);
      max-width: 500px;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <!-- Brand Logo Section -->
    <a href="#" class="brand-logo">
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="20" fill="url(#logo-grad)"/>
        <path d="M30 30L50 18L70 30V70L50 82L30 70V30Z" stroke="#06b6d4" stroke-width="6" stroke-linejoin="round"/>
        <path d="M50 18V82" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4 4"/>
        <circle cx="50" cy="50" r="12" fill="#06b6d4"/>
        <defs>
          <linearGradient id="logo-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#1e293b"/>
            <stop offset="1" stop-color="#0f172a"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="brand-text">AURA<span>TECH</span></div>
    </a>

    <!-- Navigation Links -->
    <ul class="nav-links">
      <li><a href="#features">Features</a></li>
      <li><a href="#solutions">Solutions</a></li>
      <li><a href="#about">About</a></li>
    </ul>

    <button class="btn-cta">Get Started</button>
  </header>

  <main class="hero">
    <h1 class="hero-title">Integrated Design & Automation</h1>
    <p class="hero-subtitle">Easily swap out the SVG paths in the logo markup above to integrate your custom brand vector icon or artwork.</p>
  </main>

</body>
</html>
